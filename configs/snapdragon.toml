# Snapdragon X (Windows 11 on ARM) profile. Same code path as default.toml,
# but points at w8a16 QDQ models (INT8 weights, UINT16 activations; produced by
# scripts/quantize_onnx.py or an AI Hub quantize job) and forbids silent CPU
# fallback so any unsupported op fails loudly instead of running on the CPU.
# NOTE: untested on device at the time of writing; see docs/SNAPDRAGON.md.

[runtime]
providers = ["QNNExecutionProvider", "CPUExecutionProvider"]
qnn_backend_path = "QnnHtp.dll"
qnn_htp_performance_mode = "burst"
disable_cpu_ep_fallback = true
qnn_context_cache = true
intra_op_threads = 0

[models]
clip_image = "models/onnx/clip_image.w8a16.onnx"
clip_text = "models/onnx/clip_text.w8a16.onnx"
yolo = "models/onnx/yolov8n.w8a16.onnx"

[verify]
enabled = false
base_url = "http://127.0.0.1:8000/v1"
model = "Qwen3-VL-4B-Instruct"
timeout_s = 60
weight = 0.5
